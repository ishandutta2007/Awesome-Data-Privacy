<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="80%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="80%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.18)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.12)" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.18)" />
      <stop offset="100%" stop-color="rgba(236, 72, 153, 0.12)" />
    </linearGradient>

    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.18)" />
      <stop offset="100%" stop-color="rgba(14, 165, 233, 0.12)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(56, 189, 248, 0.25)" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-12px) translateX(6px); }
    }
    @keyframes scanline {
      0% { transform: translateY(-100px); opacity: 0; }
      50% { opacity: 0.4; }
      100% { transform: translateY(500px); opacity: 0; }
    }
    @keyframes orbitSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .orb-1 { animation: pulseGlow 8s ease-in-out infinite alternate; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseGlow 10s ease-in-out infinite alternate; transform-origin: 1000px 320px; }
    .floating-pill { animation: floatParticle 6s ease-in-out infinite; }
    .floating-pill-delay { animation: floatParticle 7s ease-in-out infinite 1.5s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />

  <!-- Ambient Light Orbs (Background - Safe behind foreground text) -->
  <circle class="orb-1" cx="220" cy="120" r="160" fill="#38bdf8" filter="url(#softGlow)" opacity="0.3" />
  <circle class="orb-2" cx="980" cy="300" r="200" fill="#6366f1" filter="url(#softGlow)" opacity="0.25" />
  <circle cx="600" cy="210" r="220" fill="#a855f7" filter="url(#softGlow)" opacity="0.12" />

  <!-- Subtle Digital Mesh Grid -->
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Corner Tech Accent Borders -->
  <path d="M 30 60 L 30 30 L 60 30" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7" />
  <path d="M 1140 30 L 1170 30 L 1170 60" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7" />
  <path d="M 30 360 L 30 390 L 60 390" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.7" />
  <path d="M 1140 390 L 1170 390 L 1170 360" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.7" />

  <!-- Decorative Background Flow Circuit Waves (Kept low and non-obstructive) -->
  <path d="M 0 350 Q 300 280, 600 360 T 1200 320" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="2" />
  <path d="M 0 370 Q 350 320, 700 390 T 1200 340" fill="none" stroke="rgba(99, 102, 241, 0.18)" stroke-width="1.5" />

  <!-- Dynamic Security Shield Emblem (Centered above title) -->
  <g transform="translate(600, 85)">
    <!-- Outer Pulsing Circle -->
    <circle cx="0" cy="0" r="44" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="36" fill="rgba(99, 102, 241, 0.15)" stroke="url(#shieldGrad)" stroke-width="2" filter="url(#glow)" />
    <!-- Shield Icon Inside -->
    <path d="M -16 -14 Q 0 -22 16 -14 Q 16 10 0 22 Q -16 10 -16 -14 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Lock / Check inside shield -->
    <path d="M -6 0 L -1 5 L 8 -4" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- FOREGROUND TEXT (Clear, High Contrast, Prominent) -->
  <g id="foreground-content">
    <!-- Main Title -->
    <text x="600" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="1.5">
      AWESOME DATA PRIVACY
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">
      Curated Landscape of Enterprise Privacy SaaS, Open-Source Frameworks &amp; Compliance Engineering
    </text>

    <!-- Tag Pills Row (Foreground Interactive Element Display) -->
    <g transform="translate(600, 282)">
      <!-- Pill 1: GDPR / CCPA / CPRA -->
      <g transform="translate(-360, 0)" class="floating-pill">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#pillGrad1)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
        <circle cx="-62" cy="0" r="5" fill="#38bdf8" />
        <text x="5" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#bae6fd" text-anchor="middle">GDPR • CCPA • CPRA</text>
      </g>

      <!-- Pill 2: Data Discovery & DSPM -->
      <g transform="translate(-120, 0)" class="floating-pill-delay">
        <rect x="-95" y="-18" width="190" height="36" rx="18" fill="url(#pillGrad2)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.2" />
        <circle cx="-72" cy="0" r="5" fill="#c084fc" />
        <text x="6" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#f3e8ff" text-anchor="middle">Discovery &amp; DSPM</text>
      </g>

      <!-- Pill 3: Privacy Engineering & PETs -->
      <g transform="translate(130, 0)" class="floating-pill">
        <rect x="-105" y="-18" width="210" height="36" rx="18" fill="url(#pillGrad1)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.2" />
        <circle cx="-82" cy="0" r="5" fill="#818cf8" />
        <text x="6" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#e0e7ff" text-anchor="middle">Privacy Engineering / PETs</text>
      </g>

      <!-- Pill 4: Consent & Rights (DSAR) -->
      <g transform="translate(370, 0)" class="floating-pill-delay">
        <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#pillGrad3)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.2" />
        <circle cx="-62" cy="0" r="5" fill="#34d399" />
        <text x="5" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#d1fae5" text-anchor="middle">Consent &amp; DSAR</text>
      </g>
    </g>

    <!-- Bottom Metrics & Trust Line -->
    <g transform="translate(600, 350)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" fill="#64748b" text-anchor="middle" letter-spacing="1">
        ENTERPRISE PRICING BENCHMARKS  •  FREE TIERS  •  VERIFIED OPEN-SOURCE STAR RATINGS
      </text>
    </g>
  </g>
</svg>
